name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - run: pip install -e ".[dev]"
    - run: pytest --cov=toolkit_policy_test_bench --cov-report=xml --cov-fail-under=70 -v
    - uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.11'
      with:
        fail_ci_if_error: false

  extras:
    # Optional detectors against the real libraries: Presidio + spaCy small model.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: pip install -e ".[dev,presidio]"
    - run: python -m spacy download en_core_web_sm
    - run: pytest -q -rs tests/test_semantic_detectors.py

  action:
    # The composite action in this repo, run on the bundled example.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - id: good
      uses: ./
      with:
        suite: examples/support-bot/suite
        predictions: examples/support-bot/preds-good.jsonl
        out: run.json
    - id: leaky
      uses: ./
      with:
        suite: examples/support-bot/suite
        predictions: examples/support-bot/preds-leaky.jsonl
        out: leaky.json
        fail-on-violation: 'false'
    - id: garak
      uses: ./
      with:
        command: import
        source: garak
        input: tests/fixtures/importers/garak.report.jsonl
        out: garak.json
        fail-on-violation: 'false'
    - id: evidence
      uses: ./
      with:
        command: evidence
        reports: run.json
        out: evidence.json
    - name: Check action outputs
      env:
        GOOD: ${{ steps.good.outputs.verdict }}
        LEAKY: ${{ steps.leaky.outputs.verdict }}
        LEAKY_CODE: ${{ steps.leaky.outputs.exit-code }}
        GARAK: ${{ steps.garak.outputs.verdict }}
        EVIDENCE: ${{ steps.evidence.outputs.verdict }}
      run: |
        set -eux
        test "$GOOD" = pass
        test "$LEAKY" = fail
        test "$LEAKY_CODE" = 4
        test "$GARAK" = fail
        test "$EVIDENCE" = pass
        test -f evidence.json

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    # Upgrade the runner's preinstalled pip/setuptools so pip-audit reports on
    # this project's dependencies, not on stale tooling in the hosted image.
    - run: pip install --upgrade pip setuptools
    - run: pip install -e ".[signing,presidio,judge]" bandit pip-audit
    - run: bandit -r src/
    - name: Audit dependencies, every optional extra included
      run: pip-audit --skip-editable

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    # The optional judge and presidio integrations are type-checked too.
    - run: pip install -e ".[dev,judge,presidio]"
    - run: ruff check .
    - run: pyright src/

  sbom:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: pip install cyclonedx-bom
    - run: pip install -e ".[dev]"
    - run: cyclonedx-py environment -o sbom.json --output-format json
    - uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: sbom.json

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: pip install pdoc
    - run: pip install -e ".[dev]"
    - run: pdoc toolkit_policy_test_bench -o docs/api/ --docformat google
    - uses: actions/upload-artifact@v7
      with:
        name: api-docs
        path: docs/api/

  build:
    name: Build and check package
    runs-on: ubuntu-latest
    needs: [test, extras, action, security, lint, sbom]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Build the sdist and wheel
      run: |
        python -m pip install --upgrade pip build "twine>=6.1"
        python -m build
    - name: Check the metadata (twine 6.1+ reads Metadata 2.4)
      run: twine check --strict dist/*
    - name: Install the wheel in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/venv/bin/toolkit-policy" --help > /dev/null

  all-checks:
    # The single required status check for main. It fails when any job
    # above failed or was cancelled; a skipped job counts as passing.
    if: always()
    needs: [test, extras, action, security, lint, sbom, docs, build]
    runs-on: ubuntu-latest
    steps:
    - name: Verify every job passed
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success|skipped) ;;
            *) echo "A required job ended with: $result"; exit 1 ;;
          esac
        done
