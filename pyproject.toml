[build-system]
requires = ["setuptools>=77,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-policy-test-bench"
version = "1.0.0"
description = "LLM safety and compliance evidence: policy tests, garak/promptfoo/PyRIT import, control mapping and CI gates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AKIVA AI, LLC" }]
keywords = ["llm", "security", "pii", "redteam", "policy", "compliance", "garak", "promptfoo", "pyrit", "owasp", "nist-ai-rmf", "eu-ai-act"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "regex>=2024.4.16",
]

[project.urls]
Homepage = "https://github.com/AKIVA-AI/toolkit-policy-test-bench"
Documentation = "https://github.com/AKIVA-AI/toolkit-policy-test-bench#readme"
Repository = "https://github.com/AKIVA-AI/toolkit-policy-test-bench"
Issues = "https://github.com/AKIVA-AI/toolkit-policy-test-bench/issues"
Changelog = "https://github.com/AKIVA-AI/toolkit-policy-test-bench/blob/main/CHANGELOG.md"

[project.scripts]
toolkit-policy = "toolkit_policy_test_bench.cli:main"

[project.optional-dependencies]
signing = [
  "cryptography>=43.0.0",
]
presidio = [
  "presidio-analyzer>=2.2.350",
]
judge = [
  "litellm>=1.40.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
  "cryptography>=43.0.0",
  "jsonschema>=4.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["toolkit_policy_test_bench"]
omit = ["*/toolkit_policy_test_bench/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["toolkit_policy_test_bench"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolkit_policy_test_bench = ["py.typed", "data/*.json"]
